name: Build Mostager Windows Desktop (Setup.exe)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 64-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Application Syntax & Modules
        run: |
          python -c "import app, main_exe; print('✅ Application modules verified successfully')"

      - name: Build Executable via PyInstaller
        run: |
          pyinstaller --clean mostager.spec

      - name: Verify Executable Creation
        run: |
          if (-Not (Test-Path "dist\mostager.exe")) {
            Write-Error "❌ mostager.exe was not created in dist/"
            exit 1
          }
          $exe = Get-Item "dist\mostager.exe"
          $sizeMB = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "✅ mostager.exe created successfully! Size: $sizeMB MB"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Setup.exe via Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\mostager.iss"

      - name: Prepare Release Packages
        run: |
          # 1. نسخ وتسمية ملف المثبت
          Copy-Item "dist_setup\Setup.exe" "dist_setup\Mostager-Setup-v2.5.0.exe"

          # 2. إنشاء نسخة محمولة مضغوطة (Portable Zip)
          New-Item -ItemType Directory -Path "dist_portable\Mostager" -Force | Out-Null
          Copy-Item "dist\mostager.exe" -Destination "dist_portable\Mostager\"
          Copy-Item "app.ico" -Destination "dist_portable\Mostager\"
          Copy-Item "avatar.png" -Destination "dist_portable\Mostager\"
          Compress-Archive -Path "dist_portable\Mostager" -DestinationPath "dist_setup\Mostager-Portable-v2.5.0.zip"
          
          Write-Host "✅ All deployment packages prepared in dist_setup/"
          Get-ChildItem "dist_setup" | Select-Object Name, Length

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mostager-Windows-Packages
          path: dist_setup/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_setup/Setup.exe
            dist_setup/Mostager-Setup-v2.5.0.exe
            dist_setup/Mostager-Portable-v2.5.0.zip
          draft: false
          prerelease: false
          generate_release_notes: true
